services:
  - type: web
    name: code-rag-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements-backend.txt"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false